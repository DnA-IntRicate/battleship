[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battleship"]

[project]
name = "battleship"
version = "0.0.1"
description = "Group project for EEE3096S-2026 at the University of Cape Town (UCT)."
readme = "README.md"
authors = [
    { name = "Muddathir Firfirey" },
    { name = "Adam Foflonker" },
]
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
battleship = "battleship.main:main"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
