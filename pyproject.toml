[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battleship"]

[project]
name = "battleship"
version = "0.0.1"
description = "Group project for EEE3096S-2026 at the University of Cape Town (UCT)."
readme = "README.md"
authors = [
    { name = "Muddathir Firfirey" },
    { name = "Adam Foflonker" },
]
requires-python = ">=3.14"
dependencies = [
    "pylance>=12.0.0",
    "pyserial>=3.5",
]

[project.scripts]
battleship = "battleship.cli:main"
battleship-client = "battleship.client.main:main"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "poethepoet>=0.48.0",
]

[tool.poe.tasks]
build = "make -j"
flash = "make flash"
client = "uv run battleship-client"
ports = "python -m scripts.ports"
settle = "python -c \"import time; time.sleep(1)\"" # Let the board reboot

up = [
  { ref = "build" },
  { ref = "flash" },
  { ref = "settle" },
  { ref = "client" },
]
